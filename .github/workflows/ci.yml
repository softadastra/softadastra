name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cc: gcc
            cxx: g++
          - compiler: Clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace
        run: git diff --check
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libssl-dev
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSOFTADASTRA_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-ci --parallel
      - name: Test Softadastra
        run: ctest --test-dir build-ci --output-on-failure

  windows:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace
        shell: bash
        run: git diff --check
      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install build dependencies
        shell: pwsh
        run: vcpkg install openssl:x64-windows
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DSOFTADASTRA_BUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        shell: pwsh
        run: cmake --build build-ci --parallel
      - name: Test Softadastra
        shell: pwsh
        run: ctest --test-dir build-ci --output-on-failure
